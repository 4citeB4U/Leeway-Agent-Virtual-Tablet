name: Native Widget Geometry Source

on:
  pull_request:
    paths:
      - 'native/agent-vt/**'
      - 'package.json'
  push:
    branches:
      - 'repair/native-widget-move-geometry-*'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax-check native host
        run: node --check native/agent-vt/main.cjs
      - name: Run MOVE handle geometry regressions
        run: npm run test:native-widget
