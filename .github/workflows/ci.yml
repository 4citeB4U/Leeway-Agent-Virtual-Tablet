name: Agent Virtual Tablet CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/agent-tablet/package-lock.json
      - name: Install tablet dependencies
        working-directory: apps/agent-tablet
        run: npm ci
      - name: Lint tablet
        run: npm run lint
      - name: Test Runtime Fabric adapter contracts
        run: npm run test:integration
      - name: Build isolated tablet
        run: npm run build
