name: Deploy Agent Virtual Tablet UI

on:
  push:
    branches: [main]
    paths:
      - 'apps/agent-tablet/**'
      - 'apps/crm/**'
      - 'package.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/agent-tablet/package-lock.json
      - name: Install tablet dependencies
        working-directory: apps/agent-tablet
        run: npm ci
      - name: Build browser tablet
        working-directory: apps/agent-tablet
        env:
          VITE_BASE_PATH: /Leeway-Agent-Virtual-Tablet/
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/agent-tablet/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
