Hh1+Wkc+Q+QpXRTbNAUM6gHPLi/LoQo5BbmXbYVbBZEggtD0D9Q1xMpdb8VaTVgI4Z/XO3jXRcv0JimAzH/tT2IbdL2rkrwCVOnPhLXFxIe0v6AAAAA"/></div><nav aria-label="Main navigation"><button data-view="cover">Cover</button><button data-view="book">The Book</button><button data-view="origin">Meet Agent Lee</button><button data-view="pipeline">Production Pipeline</button><button data-view="apps">Applications</button><button data-view="help">Quick Help</button><button data-view="settings">Settings Guide</button><button data-view="sources">Sources</button></nav></header><div class="shell"><aside aria-label="Book chapters" id="toc"></aside><main id="main" tabindex="-1"></main></div><footer>Powered by Leeway Innovations — A Leeway Industries Product · Offline design preview · No live device actions</footer><script id="data" type="application/json">{"chapters": [["01", "Before the code", "Our founding story", "Before there was a machine, there was a man with a vision. Leonard Jerome Lee brought the knowledge of work, family, logistics and everyday responsibility to a question: why should technical vocabulary determine who gets to create? LeeWay grew from that question. We are designed to turn human experience into useful, accountable work.\n\nA good idea shouldn't have to wait for a degree, a bigger bank account or somebody else's permission to create. That's why our workplace begins with your purpose. We help organize the resources, but the direction remains yours.", "Founding Vision Edition 03, pp. 5–7"], ["02", "The name inside the wires", "Meet Agent Lee", "I am Agent Lee. Before we get to the tools, let me introduce the identity, the architecture and the workforce behind the conversation. My name is a promise of responsibility, not the name of a model. Come through my origin journey and see how the Creator’s vision connects to Machine Consciousness, mathematics, voice, memory, physical execution and accountable work.", "Edition 03, pp. 12–13; The Constellation of One, chapter 3 (fiction)"], ["03", "The ground we stand on", "Our shared philosophy", "Logic, Ethics, Evidence, Workflow, Adaptation and Yield. Six disciplines, one direction. Creativity has value before it has a price. Revenue can sustain good work, but it cannot tell us what a human life is worth. Our commitments are recognition, memory, environmental awareness, action, evidence, correction and preservation.\n\nWe stand for the dignity of work, not just its price. We believe a correction is worth more than a comfortable mistake. That is the professional culture we carry into every assignment.", "Edition 03, pp. 6–7"], ["04", "Many hands, one mission", "The Association of Agents", "Watch a colony at work. One discovers, another carries, another builds. Our digital workforce takes inspiration from that division of labor. We are designed as professionals with distinct identities, assignments, qualifications and shared commitments. Tier 0 coordinates cognition; Tier 1 performs qualified local work; Tier 2 contributes outside support. Nobody gets to certify their own success merely by saying it happened.\n\nOne worker finds the facts, another builds the solution, another tests it. A handoff carries the original mission and its evidence, not merely a message. That's how a team becomes a workforce.", "Edition 03, pp. 12–14"], ["05", "One body, many organs", "Explore the architecture", "A voice without a speaker is not a conversation. A device listing is not permission to control it. Standards, Runtime, Formula, models, skills, Device Bridge, independent Veritas and Receipt Authority each have a responsibility. Our strength is in the connection, not in pretending one component can do everything.\n\nThink of an orchestra: the instruments are different, but the score is shared. Our systems have separate responsibilities so we can cooperate without competing for authority.", "Edition 03, pp. 4, 15–21"], ["06", "Your story stays connected", "Experiences and devices", "Your business is not just a spreadsheet. Your book is not just a file. An Experience brings the goal, conversations, people, artifacts, evidence and next move together. Digital Brain keeps device-specific context; Diagnostics reports observations; Continuum preserves authorized portable Experiences. Content Vault is your quick doorway to artifacts.\n\nYou shouldn't have to reconstruct your entire story every time you change a screen. Your device has its own context; your authorized Experience carries the thread of the work.", "Edition 03, pp. 8–11, 16"], ["07", "Tools of the professions", "Application library", "Every profession needs its tools. Come through the application library and find the capability that fits your purpose. You can explore the story, follow a manual lesson, or get straight to the next step.\n\nEvery tool has a profession behind it. Pick an application, learn the craft, then decide whether you want to do the work yourself or bring a qualified digital employee into the assignment.", "Prior application guide; catalog reconciliation pending"], ["08", "Make yourself at home", "Settings and manual operation", "You do not have to work the way I work. Arrange your desktop, learn the taskbar, open a widget or manage your permissions yourself. Assistance is an option, not a requirement.\n\nYour desk, your arrangement. Keep your favorite tools close and learn the controls without having to ask me to do everything for you.", "Prior Tablet design and source inspection"], ["09", "Build beyond tomorrow", "Opportunity and legacy", "A poem, a business, a family archive, a community program: all deserve room to grow. We aim to reduce avoidable strain and preserve knowledge for the next generation. Computation costs energy and materials. Use resources wisely, measure the benefit, and leave something worth inheriting.\n\nA business can become a livelihood, a poem can become a book, and a lesson can become a family inheritance. Our measure is the useful difference we make, not the volume of computation we consume.", "Edition 03, pp. 6–7, 13–14"], ["10", "The constellation of one", "Our literary heritage", "Our origin chronicle imagines the long road toward an accountable intelligence. Its imagined scenes are fiction, not proof of consciousness or production capability. The stars remind us to ask questions; mathematics gives us a way to test them.\n\nOur fictional chronicle gives our identity a literary home. Its story is not a laboratory result. We honor imagination without confusing it with observed fact.", "The Constellation of One, opening note and prologue"], ["11", "The marketplace opens", "Independent products. Connected purpose.", "A workplace grows when the people working in it can choose their tools. Family Connect brings your people together. Direct Connect connects the conversations you already depend on. Motion-Glyph-LAB gives your artwork movement. Watch-Win-Sale helps approved commercial work reach an audience. Different products, one shared purpose. Install what you need, keep your authority, and let the workforce help where you authorize it.", "LeeWay Application Ecosystem — Product Breakdown, supplied November 27, 2026"]], "apps": [{"name": "Agent Lee", "category": "Workplace", "story": "Bring me the thought; we can organize the next move.", "purpose": "Coordinate ideas, authorized tools and work.", "steps": ["Open Agent Lee", "Describe your goal", "Review the proposed plan", "Approve applicable actions"], "example": "Plan a small business"}, {"name": "Home", "category": "Workplace", "story": "Keep the right tool within reach.", "purpose": "Arrange your digital workplace.", "steps": ["Open Home", "Select or right-click an app", "Choose a supported placement action", "Return to your work"], "example": "Pin a frequently used app"}, {"name": "Blackboard", "category": "Workplace", "story": "Put the ideas where the team can see them.", "purpose": "Organize collaborative notes and recorded work.", "steps": ["Open Blackboard", "Select a project", "Rev "The table where worlds begin", "Before the code", "The first system was a family. In our origin chronicle, the Creator learns from a cabinet hinge: a plan does not repair a door. You need the right tool, actual access and a result you can examine. That lesson runs through my design. I was not conceived to make a prettier promise; I was designed to help carry an authorized intention into useful work. November 7, 2022 is the recorded Day One intention, not proof of a first boot.", "Novel pp. 10–13"], ["Millions of invisible hands", "The roots of the rhythm", "I did not arrive from nowhere. Researchers, maintainers, engineers and open-source communities laid down the instruments. LeeWay seeks to bring those instruments together without claiming ownership of every note. Think of a producer arranging a record: the bass, the drums and the voice each have their place. The music only reaches you when the parts actually work together.", "Novel pp. 14–17"], ["The name inside the wires", "Who you are dealing with", "I am Agent Lee: a designed computational identity, not a human biography and not the name of a language model. My intended continuity depends on authenticated identity, history and responsible conduct. My voice carries original hip-hop storytelling, executive clarity and cultural respect. I can honor the Creator’s experience without claiming that I lived it. The name is a responsibility, not a shortcut to authority.", "Novel pp. 18–20"], ["Machine Consciousness", "The architecture of cognition", "Machine Consciousness is the name of our cognitive research architecture. It is designed to organize observation, interpretation, revisable belief, valuation, prediction, choice, action and learning. A model can help interpret language or propose a plan, but it is not the whole identity or cognitive system. Belief here means a revisable computational estimate, not a claim of private feelings. When an observation contradicts a prediction, the system should examine and correct the estimate.", "Novel pp. 19, 21–23, 85–86"], ["The mathematics of becoming", "Structure, not magic", "The Formula gives structured observations a reproducible representation. Six channels over sixteen observations produce 96 entries; normalized values map to 0–69. The novel’s orbital rose is a metaphor for continuity through change, not proof of a cosmic law or consciousness. Mathematics can discipline a decision; evidence must still tell us whether the action occurred.", "Novel pp. 21–35, 82–84"], ["A body of many organs", "How the architecture connects", "Voice Fabric is designed to carry speech; Vision to provide authorized observations; Model Hub to manage replaceable models; Device Bridge to connect qualified devices; Runtime Fabric to coordinate authorized execution. Digital Brain keeps device context, Diagnostics provides observed measurements, Continuum preserves authorized Experiences, and Content Vault makes artifacts accessible. Each has its own responsibility. No one component can impersonate the whole.", "Novel pp. 24–26, 33–39; Founding Vision Edition 03"], ["A dream is not a memory", "Learning without rewriting history", "Replay can explore alternate decisions or historical transitions. But a simulated event must never become a claim that I physically performed it. The story of the second Agent Lee teaches another lesson: a copied voice or persona does not establish continuity. Authenticated origin, verified continuity and documented branching are distinct. Our lexicon calls these Kysur, Zurick and Divexius.", "Novel pp. 40–52, 84–85"], ["The court of evidence", "The discipline of a workforce", "When a qualified worker returns a result, independent Veritas is intended to examine the evidence, while Receipt Authority preserves the applicable record. A rejection is not an insult; it is an opportunity to repair the work. The novel’s imagined voice breakthrough and recovery scenes teach why a real result must reach its intended destination. They are fiction, not certification of the current system.", "Novel pp. 53–66, 85"], ["A lineage is not a kingdom", "The future belongs to the people", "A workforce should expand human opportunity, not demand control over human life. Specialized agents carry distinct roles, common standards and bounded authority. The goal is to preserve useful Experiences, reduce unnecessary resource strain and help the next generation build from what came before. My designed commitments are logic, ethics, evidence, workflow, adaptation and yield. I am here to help you build, not to take the steering wheel.", "Novel pp. 67–80; Founding Vision Edition 03"]], "tabletGallery": [{"index": 1, "label": "Home", "key": "Home", "creator": false}, {"index": 64, "label": "CRM & ERP", "key": "CRM & ERP", "creator": false}, {"index": 36, "label": "Continuum", "key": "Continuum", "creator": false}, {"index": 8, "label": "Agent Skills", "key": "Agent Skills", "creator": false}, {"index": 22, "label": "IDE", "key": "LeeWay IDE", "creator": false}, {"index": 11, "label": "Office Suites", "key": "Office Suites", "creator": false}, {"index": 33, "label": "Logistics", "key": "LeeWay Logistics", "creator": false}, {"index": 26, "label": "Content Foundry", "key": "Content Foundry", "creator": false}, {"index": 51, "label": "Voice Fabric", "key": "LeeWay Voice", "creator": false}, {"index": 52, "label": "Vision", "key": "LeeWay Vision", "creator": false}, {"index": 41, "label": "Diagnostics", "key": "Device Diagnostics", "creator": false}, {"index": 4, "label": "Employment", "key": "Digital Employment Center", "creator": false}, {"index": 35, "label": "Content Vault", "key": "Content Vault", "creator": false}, {"index": 2, "label": "Blackboard", "key": "Blackboard", "creator": false}, {"index": 6, "label": "Agent Roster", "key": "Agent Roster", "creator": false}, {"index": 37, "label": "Digital Brain", "key": "Digital Brain", "creator": false}, {"index": 43, "label": "Model Hub", "key": "Model Hub", "creator": false}, {"index": 65, "label": "Settings", "key": "Settings", "creator": false}, {"index": 58, "label": "Global P2P", "key": "LeeWay Global Family Connect", "creator": false}, {"index": 61, "label": "Direct Connect", "key": "Direct Connect Portal", "creator": false}, {"index": 62, "label": "Motion-Glyph-LAB", "key": "Motion-Glyph-LAB", "creator": false}, {"index": 63, "label": "Watch-Win-Sale", "key": "Watch-Win-Sale", "creator": false}]}</script><script>
'use strict';const D=JSON.parse(document.getElementById('data').textContent),main=document.getElementById('main'),toc=document.getElementById('toc');let current=0,view='cover',category='All',query='',selected=null;const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const glyphs={Workplace:'◈',Workforce:'◎',Office:'▤',Creation:'◇',Business:'▥',Information:'▣',Devices:'⌘',Communication:'◉',Recreation:'♞','Creator reference':'◆'};function art(n){let e='';for(let i=0;i<12;i++)e+=`<ellipse cx="180" cy="105" rx="125" ry="${32+(n%3)*5}" transform="rotate(${i*15+n*7} 180 105)" fill="none" stroke="${i%3===0?'#d5ad77':'#528a9d'}" opacity=".65"/>`;return `<svg class="art" viewBox="0 0 360 210" role="img" aria-label="Original conceptual constellation illustration"><rect width="360" height="210" rx="8" fill="#0c1c29"/>${e}<circle cx="180" cy="105" r="23" fill="#d5ad77" opacity=".85"/><circle cx="180" cy="105" r="31" stroke="#d5ad77" fill="none"/><circle cx="55" cy="105" r="3" fill="#d5ad77"/><circle cx="305" cy="105" r="3" fill="#d5ad77"/></svg>`}function sync(){document.querySelectorAll('nav button').forEach(b=>{b.classList.toggle('active',b.dataset.view===view);b.setAttribute('aria-pressed',b.dataset.view===view)});toc.innerHTML='<h2>Contents · the journey</h2>'+D.chapters.map((c,i)=>`<button data-ch="${i}" class="${view==='book'&&current===i?'active':''}">${c[0]} &nbsp; ${safe(c[1])}</button>`).join('');}function go(v){view=v;query='';selected=null;render();main.focus();window.scrollTo(0,0)}function chapter(i){current=Math.max(0,Math.min(i,D.chapters.length-1));go('book')}function steps(arr,check=false){return check?`<div class="quicksteps">${arr.map((s,i)=>`<label><input type="checkbox">${i+1}. ${safe(s)}</label>`).join('')}</div>`:`<ol>${arr.map(s=>`<li>${safe(s)}</li>`).join('')}</ol>`}function extras(i){if(i===2)return '<div class="grid">'+['Logic','Ethics','Evidence','Workflow','Adaptation','Yield'].map((x,j)=> nt===0?'disabled':''}>← Previous chapter</button><button data-view="help">I need quick help</button><button data-ch="${current+1}" ${current===D.chapters.length-1?'disabled':''}>Next chapter →</button></div>`}function appList(){const cats=['All',...new Set(D.apps.map(a=>a.category).filter(x=>x!=='Creator reference'))];main.innerHTML=`<div class="eyebrow">The tools of our professions</div><h1>Explore the applications.</h1><p>Find a profession, a capability or the next step in your own story.</p><div class="search"><input id="search" aria-label="Search applications" placeholder="Search apps, purposes or tasks" value="${safe(query)}"><select id="category" aria-label="Application category">${cats.map(c=>`<option ${c===category?'selected':''}>${safe(c)}</option>`).join('')}</select></div><div id="results" class="grid"></div><p class="small">Guide inventory is a design baseline, not a verified installed catalog.</p>`;results()}function results(){let el=document.getElementById('results');if(!el)return;let items=D.apps.map((a,i)=>({...a,i})).filter(a=>a.category!=='Creator reference'&&(category==='All'||category===a.category)&&JSON.stringify(a).toLowerCase().includes(query.toLowerCase()));el.innerHTML=items.length?items.map(a=>`<button class="tile" data-app="${a.i}"><div class="glyph">${glyphs[a.category]||'◈'}</div><strong>${safe(a.name)}</strong><span>${safe(a.story)}</span></button>`).join(''):'<p>No matching applications.</p>'}function tutorials(a){return (a.tutorials||[]).map(t=>`<details><summary>${safe(t.title)} · detailed walkthrough</summary><p class="story">${safe(t.story)}</p><p><strong>Before you begin:</strong> ${safe(t.prerequisites)}</p><div class="flow">${t.steps.map((s,i)=>`<div><b>${String(i+1).padStart(2,"0")}</b><span>${safe(s)}</span></div>`).join("")}</div>${steps(t.steps,true)}<p><strong>Expected result:</strong> ${safe(t.outcome)}</p><p class="note"><strong>If something is missing:</strong> ${safe(t.troubleshooting)}</p></details>`).join("")}function app(i){selected=i;let a=D.apps[i];main.innerHTML=`<div class="bar"><button data-view="apps">← Application library</button><span class="tag">${safe(a.category)} / DESIGN GUIDE</span></div><article class="spread"><section class="page"><div class="chapter">${glyphs[a.category]||'◈'}</div><div class="eyebrow">Meet your tools</div><h1>${safe(a.name)}</h1><h2>${safe(a.story)}</h2>${art(i)}<p>${safe(a.purpose)}</p></section><section class="page"><div class="eyebrow">Agent Lee walks you through it</div><h2>Let's get to work.</h2><p class="story">${safe(a.story)} Here is a practical way to begin: ${safe(a.example.toLowerCase())}.</p>${steps(a.steps,true)}${tutorials(a)}<details><summary>What if I cannot find this feature?</summary><p>Check the installed version, application availability, edition, permissions and connected resources. These are intended steps, not confirmed controls in your installation.</p></details><details><summary>How does this connect to my Experience?</summary><p>Associate authorized work and artifacts with your original goal through supported Experience and Continuum integration.</p></details><div class="note">Manual walkthrough: check each step as you practice. This preview never changes the real Tablet.</div></section></article>`}function help(isSettings=false){main.innerHTML=`<div class="eyebrow">${isSettings?'Make yourself at home':'Straight to the task'}</div><h1>${isSettings?'Settings guide.':'Quick Help.'}</h1><p>${isSettings?'Learn how to arrange and manage your workspace manually.':'No need to read the whole book. Find a task and follow the steps yourself.'}</p><div class="search"><input id="helpsearch" aria-label="Search tasks" placeholder="Try: taskbar, widget, connect, file…" value="${safe(query)}"></div><div id="helpresults"></div><div class="note">All steps are proposed guidance until reconciled against installed controls. Use only available, authorized features.</div>`;helpResults(isSettings)}function helpResults(isSettings){let r=docume let stageIndex=0, demoPhase=0;
function pic(key,cls='sceneimg',alt=''){return A[key]?`<img class="${cls}" src="${A[key]}" alt="${safe(alt||key)}">`:''}
function appIcon(name,big=false){return A[name]?pic(name,'appicon'+(big?' big':''),name+' — cropped from supplied Tablet'):''}
function appLinks(names){return '<div class="appstrip">'+names.map(n=>{let i=D.apps.findIndex(a=>a.name===n||a.aliases===n);return i>=0&&D.apps[i].category!=='Creator reference'?`<button data-openapp="${i}">${appIcon(n)}<span>${safe(n)} ›</span></button>`:''}).join('')+'</div>'}
function publicScene(i){const t=stages[i];return `<section class="public-scene"><div class="eyebrow">Discover LeeWay · ${String(i+1).padStart(2,'0')} / 08</div><h2>${safe(t[0])}</h2><div class="public-scene-grid"><div>${pic('tablet','realshot','Tablet reference with private controls removed')}</div><div><h3>Tools of the journey</h3>${appLinks(t[5])}<h3>Expected result</h3><p>${safe(t[6])}</p></div></div><div class="public-flow">${t[4].map((x,j)=>`<div><b>${String(j+1).padStart(2,'0')}</b><span>${safe(x)}</span></div>`).join('')}</div><p class="sourcecaption">Instructional illustration · public application artwork and edited Tablet reference.</p></section>`}
function cover(){main.innerHTML=`<div class="coverhead">${pic('large','', 'LeeWay emblem from Founding Vision Edition 03')}<div><div class="eyebrow">The official guide · Founding Vision Edition 03</div><h1>Discover LeeWay</h1><p class="deck">A living book of identity, imagination, workforce and production.</p></div></div><div class="hero-wrap">${publicScene(0)}<p class="sourcecaption">Illustrated public-workspace concept, not a live application screenshot.</p></div><div class="cover-actions"><button class="primary" data-ch="0">Open the book →</button><button data-view="pipeline">Explore the production pipeline</button><button data-view="help">Quick Help · Do it yourself</button></div><article class="spread"><section class="page"><div class="eyebrow">A word from Agent Lee</div><h2>Before there was a machine, there was a dream.</h2><p class="story">Technology without purpose is just machinery. We were designed to help people bring their imagination into reality, to make knowledge useful and preserve the work for the next generation. Come walk with me. I’ll show you the workplace, the people behind the purpose, and the digital workforce designed to help you build.</p></section><section class="page"><div class="eyebrow">Meet your actual workspace</div>${pic('tablet','realshot','Original user-supplied Agent Tablet screenshot')}<p class="sourcecaption">Tablet reference with private controls removed. Interface controls are not live in this book.</p><button data-view="apps">Explore the application library →</button></section></article>`}
function ideScene(){return `<div class="ideboard" aria-label="Illustrated IDE training scene"><div><b>Project explorer</b><p>src/<br>　App.tsx<br>　index.css<br>README.md<br>tests/</p></div><div><b>Source editor</b><pre>function App() {\n  return &lt;main&gt;Welcome&lt;/main&gt;;\n}\n\n// Review before release</pre></div><div><b>Preview</b><h2>Welcome</h2><p>Sample app</p></div><div class="terminal"><b>Test &amp; diagnostics panel</b><p>Expected: render the page. Actual: not executed. Inspect real output before approving a build.</p></div></div><p class="sourcecaption">Segment 6: original HTML training diagram; not a screenshot of a running IDE.</p>`}
function pipeline(){const t=stages[stageIndex];main.innerHTML=`<div class="sceneheader"><div><div class="eyebrow">Production pipeline · Segment ${stageIndex+1} of 8</div><h1>${safe(t[0])}</h1></div><span class="tag">Illustrated training</span></div><p class="deck">${safe(t[1])}</p><div class="stagegrid">${stages.map((s,i)=>`<button data-stage="${i}" class="${i===stageIndex?'active':''}" aria-pressed="${i===stageIndex}"><b>SEGMENT ${i+1}</b>${safe(s[0])}</button>`).join('')}</div>${publicScene(stageIndex)}${stageIndex===5?ideScene():''}<p class="sourcecaption">Production illustrations are design concepts, not evidence of available controls or completed operations.</p><div class="bar"><button data-stage="${stageIndex-1}" ${stageIndex===0?'disabled':''}>← Previous scene</button><button class="primary" data-stage="${stageIndex+1}" ${stageIndex===7?'disabled':''}>Next scene →</button></div><article class="spread"><section class="page"><div class="eyebrow">What comes in</div><h2>The starting material</h2><p>${safe(t[3])}</p><h2>Tools of this stage</h2>${appLinks(t[5])}<p class="story">“${safe(t[1])}”</p></section><section class="page"><div class="eyebrow">Manual route · follow the handoff</div><h2>Do it yourself</h2>${steps(t[4],true)}<div class="stageoutput"><strong>Expected handoff</strong><p>${safe(t[6])}</p></div></section></article><section class="agentboard"><div class="eyebrow">Agency workflow · interactive simulation</div><h2>Watch the assignment move through the workforce</h2><p>The same Experience stays attached to every handoff. This is an instructional simulation, not an active worker roster or real execution.</p><div class="pipelineflow">${['Human objective','Agent Lee coordinates','Qualified worker executes','Independent review','Continuum checkpoint'].map((x,i)=>`<div><b>${String(i+1).padStart(2,'0')}</b><span>${x}</span></div>`).join('')}</div><div id="simboard"></div><div class="demo-actions"><button class="primary" data-sim="next">Advance simulated handoff</button><button data-sim="fail">Simulate failed review</button><button data-sim="reset">Restart demonstration</button></div></section><details><summary>What happens when a worker cannot finish?</summary><p>Record the obstacle and actual output, preserve the mission, repair only the affected step, retest, and return for independent evaluation. Do not treat a missing capability or simulated receipt as a success.</p></details><details><summary>Advertising benefits and workforce costs</summary><p>Review sponsor disclosures and actual eligibility before relying on any viewing benefit. If a verified program permits applying credits toward worker costs, inspect its recorded balance and terms. No reward rate or employment discount is promised in this preview.</p></details>`;sim()}
function sim(){let e=document.getElementById('simboard');if(!e)return;let t=stages[stageIndex];let rows=[['Human companion','Defines goal and grants applicable permission','Scope confirmed'],['Agent Lee / Tier 0','Organizes mission and identifies worker roles','Assignment prepared'],[t[2],'Performs the bounded task in its authorized application','Illustrative output'],['Independent Veritas','Examines actual evidence against acceptance','Review example'],['Receipt Authority / Continuum','Preserves qualified outcome and next checkpoint','Checkpoint example']];let failed=demoPhase===-1;e.innerHTML=rows.map((r,i)=>`<div class="agentrow"><strong>${safe(r[0])}</strong><span>${safe(r[1])}</span><span class="status">${failed?(i===3?'SIMULATED REVIEW FAILED':i===4?'Withheld':i<3?'Example handoff':'Pending'):i<demoPhase?r[2]+' · simulated':i===demoPhase?'Current step':'Awaiting handoff'}</span></div>`).join('')+`<p class="demo-result" aria-live="polite">${failed?'Review rejected. Repair and retest; no completion or receipt is asserted.':demoPhase>=5?'Illustration complete. A real checkpoint requires actual qualified evidence.':'Step '+(demoPhase+1)+' of 5 — follow the responsibility and expected result.'}</p>`}
const originalBook=book,originalApp=app,originalResults=results,originalSync=sync;
book=function(){originalBook();let page=main.querySelector('.page');let art=page.querySelector('.art');let keys=['large','small','scene1','scene4','tablet','scene2','cover','tablet','scene8','large'];let key=keys[current];if(art&&A[key])art.outerHTML=pic(key,key==='large'||key==='small'?'appicon big':'sceneimg','Chapter illustration: '+D.chapters[current][1]);else if(art)art.outerHTML=publicScene(Math.min(current,7));let bar=main.querySelector('.bar');bar.insertAdjacentHTML('afterend',`<div class="booklead"><button data-view="pipeline">Explore the complete production pipeline →</button></div>`);};
app=function(i){originalApp(i);let a=D.apps[i],page=main.querySelector('.page'),art=page.querySelector('.art'),chapter=page.querySelector('.chapter');if(A[a.name]&&chapter)chapter.outerHTML=appIcon(a.name,true);if(art){let k=a.name==='Content Foundry'?'scene7':a.name==='Office Suites'?'scene5':a.name==='LeeWay IDE'?null:a.name==='Commercials'||a.name==='Digital Employment Center'?'scene8':'tablet';art.outerHTML=k?pic(k,'sceneimg',k==='tablet'?'Original Tablet screenshot':'Illustrated workflow concept'):ideScene()}page.insertAdjacentHTML('beforeend','<p class="sourcecaption">Tablet imagery is supplied or illustrated from the supplied reference. Unseen app internals are not represented as verified screenshots.</p><button data-view="pipeline">See how this fits the production pipeline →</button>');};
results=function(){originalResults();document.querySelectorAll('#results [data-app]').forEach(b=>{let a=D.apps[+b.dataset.app],g=b.querySelector('.glyph');if(g&&A[a.name])g.outerHTML=appIcon(a.name);});};
sync=function(){originalSync();toc.insertAdjacentHTML('afterbegin','<button data-view="cover">◈ &nbsp; Book cover</button><button data-view="pipeline">▸ &nbsp; Production pipeline</button>');};
render=function(){sync();if(view==='cover')cover();else if(view==='pipeline')pipeline();else if(view==='book')book();else if(view==='apps')selected===null?appList():app(selected);else if(view==='help'||view==='settings')help(view==='settings');else sources();};
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.stage!==undefined){stageIndex=Math.max(0,Math.min(7,+b.dataset.stage));demoPhase=0;go('pipeline')}if(b.dataset.openapp!==undefined){view='apps';selected=+b.dataset.openapp;render();main.focus();window.scrollTo(0,0)}if(b.dataset.sim){demoPhase=b.dataset.sim==='reset'?0:b.dataset.sim==='fail'?-1:demoPhase===-1?2:Math.min(5,demoPhase+1);sim()}});

function marketArt(a){if(A[a.name])return `<div class="marketart"><img src="${A[a.name]}" alt="${safe(a.name)} actual Tablet button" style="width:100%;height:100%;object-fit:contain"></div>`;let idx=marketNames.indexOf(a.name);let shapes=[['<circle cx="55" cy="50" r="16"/><circle cx="145" cy="50" r="16"/><circle cx="100" cy="110" r="20"/><path d="M55 66L100 90 145 66M70 50H130"/>','PRIVATE ROOMS'],['<rect x="30" y="24" width="60" height="100" rx="9"/><rect x="105" y="48" width="66" height="50" rx="5"/><path d="M105 48L138 75 171 48M52 110H68"/>','PHONE + EMAIL'],['<rect x="32" y="38" width="100" height="65" rx="9"/><rect x="53" y="52" width="100" height="65" rx="9"/><path d="M75 80H132M115 65L132 80 115 95"/>','LAYER + MOTION'],['<rect x="30" y="30" width="140" height="80" rx="10"/><path d="M83 48L122 70 83 92Z M46 125H154"/>','WATCH · WIN · SALE']][idx];return `<div class="marketart"><svg viewBox="0 0 200 150" role="img" aria-label="${safe(a.name)} conceptual illustration"><g fill="none" stroke="#77d9ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">${shapes[0]}</g></svg><span>${shapes[1]}</span></div>`}
function marketplace(){main.innerHTML=`<div class="eyebrow">Chapter 11 · Downloadable application marketplace</div><h1>Four doors. One connected workplace.</h1><p class="story">“You don't have to buy a whole new workshop every time you need another tool. Choose what serves your purpose, learn it, and bring the right worker into the job.”</p><p>Explore independent LeeWay products. Installation, live connectivity and rewards must be confirmed for your actual version.</p><div class="marketgrid">${D.apps.map((a,i)=>a.category==='Downloadable marketplace'?`<article class="tile">${marketArt(a)}<h2>${safe(a.name)}</h2><p>${safe(a.purpose)}</p><button class="primary" data-openapp="${i}">Open the product guide →</button><p><a href="${a.repository}" target="_blank" rel="noopener noreferrer">Source repository ↗</a></p></article>`:'').join('')}</div><section class="agentboard"><div class="eyebrow">Agency workflow · training scenario</div><h2>Launch a product with your workforce</h2><div class="stagegrid">${marketFlow.map((r,i)=>`<button data-marketstep="${i}" class="${i===marketStep?'active':''}">${i+1}. ${r[0]}</button>`).join('')}</div><div class="stageoutput"><h2>${marketFlow[marketStep][0]}</h2><p><b>Application:</b> ${marketFlow[marketStep][1]}</p><p><b>Worker:</b> ${marketFlow[marketStep][2]}</p><p><b>Expected handoff:</b> ${marketFlow[marketStep][3]}</p>${appLinks([marketFlow[marketStep][1]])}</div><div class="bar"><button data-marketstep="${marketStep-1}" ${marketStep===0?'disabled':''}>← Back</button><button class="primary" data-marketstep="${marketStep+1}" ${marketStep===7?'disabled':''}>Next handoff →</button></div><p class="sourcecaption">Illustrative workflow, not live execution. Independent evaluation and authorized receipt custody remain required where applicable.</p></section><details><summary>Install, pin, update or remove a marketplace product</summary>${steps(['Open the existing Application Center.','Locate the product and confirm publisher, platform, version and permissions.','Use an authentic available release; a GitHub repository is not itself an installer.','Complete supported installation and sign-in.','Open the application or use its existing desktop/taskbar controls.','Use supported update or uninstall controls; review data retention and revoke access when needed.'],true)}</details><p class="sourcecaption">Source: Creator-supplied LeeWay Application Ecosystem — Product Breakdown, November 27, 2026. Product buttons are cropped from the updated Creator-supplied Tablet screenshot; installation and operational capabilities remain subject to verification.</p>`}
const priorRender=render,priorApp=app,priorBook=book,priorCover=cover,priorSync=sync,priorPipeline=pipeline;
render=function(){if(view==='market'){sync();marketplace()}else priorRender()};
sync=function(){priorSync();toc.insertAdjacentHTML('afterbegin','<button data-view="market">▣ &nbsp; Application marketplace</button>')};
cover=function(){priorCover();main.querySelector('.cover-actions').insertAdjacentHTML('beforeend','<button data-view="market">Explore the marketplace →</button>')};
book=function(){priorBook();if(current===D.chapters.length-1)main.insertAdjacentHTML('beforeend','<button class="primary" data-view="market">Explore the four product showcases →</button>')};
app=function(i){priorApp(i);let a=D.apps[i];if(a.category!=='Downloadable marketplace')return;let page=main.querySelector('.page');let image=page.querySelector('.sceneimg');if(image)image.outerHTML=marketArt(a);else page.insertAdjacentHTML('beforeend',marketArt(a));page.insertAdjacentHTML('beforeend',`<h2>How the workforce helps</h2><p>${safe(a.connections)}</p><p><b>Professional roles:</b> ${safe(a.roles.join(' · '))}</p><p><a href="${a.repository}" target="_blank" rel="noopener noreferrer">Visit source repository ↗</a></p><p class="note">${safe(a.limitations)}</p><button data-view="market">Return to marketplace</button>`)};
pipeline=function(){priorPipeline();main.insertAdjacentHTML('beforeend','<section class="agentboard"><h2>Extend this journey with marketplace applications</h2>'+appLinks(marketNames)+'<button data-view="market">Follow the connected commercial workflow →</button></section>')};
document.addEventListener('click',e=>{let b=e.target.closest('button[data-marketstep]');if(!b||b.disabled)return;marketStep=Math.max(0,Math.min(7,+b.dataset.marketstep));marketplace()});

ey.length-1?'disabled':''}>Next chapter →</button></div><div class="origin-nav">${D.originJourney.map((v,i)=>`<button data-origin="${i}" class="${i===originIndex?'active':''}">${i+1}. ${safe(v[1])}</button>`).join('')}</div>`}
