<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0d1b4b"/>
      <stop offset="100%" stop-color="#06091a"/>
    </radialGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00b8d9"/>
      <stop offset="100%" stop-color="#0052cc"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd600"/>
      <stop offset="100%" stop-color="#ff8f00"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Globe glow -->
  <ellipse cx="256" cy="240" rx="145" ry="145" fill="#003380" opacity="0.3" filter="url(#blur)"/>
  <!-- Globe meridians -->
  <circle cx="256" cy="240" r="145" fill="none" stroke="url(#glow)" stroke-width="2.5" opacity="0.7"/>
  <ellipse cx="256" cy="240" rx="72" ry="145" fill="none" stroke="url(#glow)" stroke-width="1.5" opacity="0.5"/>
  <ellipse cx="256" cy="240" rx="145" ry="58" fill="none" stroke="url(#glow)" stroke-width="1.5" opacity="0.5"/>
  <line x1="111" y1="240" x2="401" y2="240" stroke="url(#glow)" stroke-width="1.5" opacity="0.4"/>
  <!-- Route lines -->
  <path d="M150 290 Q200 220 310 180" fill="none" stroke="url(#gold)" stroke-width="3" stroke-dasharray="8 4" opacity="0.9"/>
  <!-- Pin markers -->
  <circle cx="150" cy="290" r="8" fill="url(#gold)"/>
  <circle cx="310" cy="180" r="8" fill="url(#gold)"/>
  <!-- Connecting arc glow -->
  <path d="M150 290 Q200 220 310 180" fill="none" stroke="#ffd600" stroke-width="1" opacity="0.4" filter="url(#blur)"/>
  <!-- Bottom bar -->
  <rect x="80" y="410" width="352" height="5" rx="3" fill="url(#gold)" opacity="0.7"/>
</svg>
