<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2d0045"/>
      <stop offset="100%" stop-color="#06091a"/>
    </radialGradient>
    <linearGradient id="purp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e040fb"/>
      <stop offset="100%" stop-color="#7b1fa2"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd600"/>
      <stop offset="100%" stop-color="#ff8f00"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Play button / media circle -->
  <circle cx="220" cy="220" r="90" fill="#1a0030" stroke="url(#purp)" stroke-width="3" opacity="0.9"/>
  <polygon points="202,180 202,260 272,220" fill="url(#purp)" opacity="0.9"/>
  <!-- Transformation arrow cluster -->
  <line x1="320" y1="200" x2="390" y2="160" stroke="url(#gold)" stroke-width="3" opacity="0.8"/>
  <line x1="320" y1="230" x2="390" y2="230" stroke="url(#gold)" stroke-width="3" opacity="0.8"/>
  <line x1="320" y1="260" x2="390" y2="300" stroke="url(#gold)" stroke-width="3" opacity="0.8"/>
  <!-- Output doc -->
  <rect x="345" y="140" width="60" height="45" rx="6" fill="#2d0045" stroke="url(#purp)" stroke-width="2"/>
  <rect x="345" y="210" width="60" height="45" rx="6" fill="#2d0045" stroke="url(#purp)" stroke-width="2"/>
  <rect x="345" y="280" width="60" height="45" rx="6" fill="#2d0045" stroke="url(#purp)" stroke-width="2"/>
  <!-- Glow -->
  <ellipse cx="220" cy="220" rx="90" ry="90" fill="#6a0080" opacity="0.2" filter="url(#blur)"/>
  <!-- Bottom bar -->
  <rect x="80" y="400" width="352" height="5" rx="3" fill="url(#gold)" opacity="0.8"/>
</svg>
