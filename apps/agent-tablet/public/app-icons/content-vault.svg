<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2d1600"/>
      <stop offset="100%" stop-color="#06091a"/>
    </radialGradient>
    <linearGradient id="amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd740"/>
      <stop offset="100%" stop-color="#ff6d00"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#40c4ff"/>
      <stop offset="100%" stop-color="#0091ea"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Lock body -->
  <rect x="166" y="230" width="180" height="150" rx="20" fill="#0a1929" stroke="url(#amber)" stroke-width="4"/>
  <!-- Lock shackle -->
  <path d="M210 230 L210 175 Q210 125 256 125 Q302 125 302 175 L302 230" fill="none" stroke="url(#amber)" stroke-width="10" stroke-linecap="round"/>
  <!-- Keyhole -->
  <circle cx="256" cy="295" r="22" fill="url(#amber)" opacity="0.9"/>
  <rect x="246" y="310" width="20" height="35" rx="4" fill="url(#amber)" opacity="0.9"/>
  <!-- Gold glow behind lock -->
  <ellipse cx="256" cy="300" rx="100" ry="90" fill="#ff6d00" opacity="0.12" filter="url(#blur)"/>
  <!-- Shield overlay top-right corner -->
  <path d="M390 130 L430 150 L430 195 Q430 230 390 245 Q350 230 350 195 L350 150Z" fill="#0a1929" stroke="url(#blue)" stroke-width="3" opacity="0.85"/>
  <path d="M390 155 L410 165 L410 195 Q410 215 390 225 Q370 215 370 195 L370 165Z" fill="url(#blue)" opacity="0.5"/>
  <!-- Bottom bar -->
  <rect x="80" y="410" width="352" height="5" rx="3" fill="url(#amber)" opacity="0.8"/>
</svg>
