<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00102e"/>
      <stop offset="100%" stop-color="#06091a"/>
    </radialGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#40c4ff"/>
      <stop offset="100%" stop-color="#0091ea"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd600"/>
      <stop offset="100%" stop-color="#ff8f00"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Neural tree branches (Digital Brain) -->
  <!-- Trunk -->
  <line x1="256" y1="390" x2="256" y2="265" stroke="url(#blue)" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
  <!-- Main branches -->
  <line x1="256" y1="300" x2="175" y2="225" stroke="url(#blue)" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <line x1="256" y1="300" x2="337" y2="225" stroke="url(#blue)" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <line x1="256" y1="265" x2="256" y2="190" stroke="url(#blue)" stroke-width="3.5" stroke-linecap="round" opacity="0.7"/>
  <!-- Sub branches -->
  <line x1="175" y1="225" x2="130" y2="170" stroke="url(#blue)" stroke-width="2.5" opacity="0.65"/>
  <line x1="175" y1="225" x2="195" y2="160" stroke="url(#blue)" stroke-width="2.5" opacity="0.65"/>
  <line x1="337" y1="225" x2="380" y2="170" stroke="url(#blue)" stroke-width="2.5" opacity="0.65"/>
  <line x1="337" y1="225" x2="315" y2="160" stroke="url(#blue)" stroke-width="2.5" opacity="0.65"/>
  <line x1="256" y1="190" x2="230" y2="140" stroke="url(#blue)" stroke-width="2" opacity="0.6"/>
  <line x1="256" y1="190" x2="282" y2="140" stroke="url(#blue)" stroke-width="2" opacity="0.6"/>
  <!-- Node dots -->
  <circle cx="256" cy="390" r="8" fill="url(#blue)"/>
  <circle cx="256" cy="300" r="10" fill="url(#blue)"/>
  <circle cx="175" cy="225" r="9" fill="url(#blue)" opacity="0.9"/>
  <circle cx="337" cy="225" r="9" fill="url(#blue)" opacity="0.9"/>
  <circle cx="256" cy="190" r="8" fill="url(#blue)" opacity="0.85"/>
  <circle cx="130" cy="170" r="7" fill="url(#blue)" opacity="0.7"/>
  <circle cx="195" cy="160" r="7" fill="url(#blue)" opacity="0.7"/>
  <circle cx="380" cy="170" r="7" fill="url(#blue)" opacity="0.7"/>
  <circle cx="315" cy="160" r="7" fill="url(#blue)" opacity="0.7"/>
  <circle cx="230" cy="140" r="6" fill="url(#blue)" opacity="0.6"/>
  <circle cx="282" cy="140" r="6" fill="url(#blue)" opacity="0.6"/>
  <!-- Glow at center -->
  <ellipse cx="256" cy="265" rx="90" ry="80" fill="#0050a0" opacity="0.15" filter="url(#blur)"/>
  <!-- Bottom bar -->
  <rect x="80" y="425" width="352" height="5" rx="3" fill="url(#gold)" opacity="0.8"/>
</svg>
