<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00202e"/>
      <stop offset="100%" stop-color="#06091a"/>
    </radialGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#006064"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd600"/>
      <stop offset="100%" stop-color="#ff8f00"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Hexagon agent roster grid -->
  <!-- Center hex -->
  <polygon points="256,135 306,163 306,219 256,247 206,219 206,163" fill="none" stroke="url(#cyan)" stroke-width="3" opacity="0.9"/>
  <circle cx="256" cy="191" r="30" fill="url(#cyan)" opacity="0.8"/>
  <!-- Orbiting agents -->
  <polygon points="150,195 185,215 185,255 150,275 115,255 115,215" fill="none" stroke="url(#cyan)" stroke-width="2" opacity="0.6"/>
  <circle cx="150" cy="235" r="20" fill="url(#cyan)" opacity="0.6"/>
  <polygon points="362,195 397,215 397,255 362,275 327,255 327,215" fill="none" stroke="url(#cyan)" stroke-width="2" opacity="0.6"/>
  <circle cx="362" cy="235" r="20" fill="url(#cyan)" opacity="0.6"/>
  <polygon points="256,290 291,310 291,350 256,370 221,350 221,310" fill="none" stroke="url(#cyan)" stroke-width="2" opacity="0.6"/>
  <circle cx="256" cy="330" r="20" fill="url(#cyan)" opacity="0.6"/>
  <!-- Connecting lines -->
  <line x1="206" y1="210" x2="185" y2="230" stroke="url(#cyan)" stroke-width="1.5" stroke-dasharray="5 3" opacity="0.5"/>
  <line x1="306" y1="210" x2="327" y2="230" stroke="url(#cyan)" stroke-width="1.5" stroke-dasharray="5 3" opacity="0.5"/>
  <line x1="256" y1="247" x2="256" y2="310" stroke="url(#cyan)" stroke-width="1.5" stroke-dasharray="5 3" opacity="0.5"/>
  <!-- Glow -->
  <ellipse cx="256" cy="260" rx="140" ry="130" fill="#00695c" opacity="0.1" filter="url(#blur)"/>
  <!-- Bottom bar -->
  <rect x="80" y="405" width="352" height="5" rx="3" fill="url(#gold)" opacity="0.8"/>
</svg>
