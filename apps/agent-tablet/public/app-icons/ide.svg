<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00202e"/>
      <stop offset="100%" stop-color="#06091a"/>
    </radialGradient>
    <linearGradient id="code" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#0097a7"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd600"/>
      <stop offset="100%" stop-color="#ff8f00"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Terminal window frame -->
  <rect x="80" y="110" width="352" height="280" rx="12" fill="#0a1929" stroke="url(#code)" stroke-width="2.5"/>
  <!-- Title bar -->
  <rect x="80" y="110" width="352" height="40" rx="12" fill="#0d2137"/>
  <rect x="80" y="130" width="352" height="20" fill="#0d2137"/>
  <!-- Title bar dots -->
  <circle cx="112" cy="130" r="7" fill="#ff5f56"/>
  <circle cx="135" cy="130" r="7" fill="#ffbd2e"/>
  <circle cx="158" cy="130" r="7" fill="#27c93f"/>
  <!-- Code chevrons -->
  <text x="100" y="205" font-family="monospace" font-size="52" fill="url(#code)" opacity="0.9">&lt;/&gt;</text>
  <!-- Code lines -->
  <rect x="100" y="225" width="180" height="8" rx="4" fill="url(#code)" opacity="0.6"/>
  <rect x="100" y="248" width="240" height="8" rx="4" fill="url(#code)" opacity="0.4"/>
  <rect x="100" y="271" width="140" height="8" rx="4" fill="url(#code)" opacity="0.5"/>
  <rect x="100" y="294" width="200" height="8" rx="4" fill="url(#code)" opacity="0.35"/>
  <rect x="100" y="317" width="160" height="8" rx="4" fill="url(#code)" opacity="0.5"/>
  <!-- Gold accent line -->
  <rect x="80" y="385" width="352" height="5" rx="3" fill="url(#gold)" opacity="0.8"/>
  <!-- Glow behind window -->
  <ellipse cx="256" cy="250" rx="140" ry="120" fill="#006080" opacity="0.12" filter="url(#blur)"/>
</svg>
