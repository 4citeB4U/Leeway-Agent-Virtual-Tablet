<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a1929"/>
      <stop offset="100%" stop-color="#06091a"/>
    </radialGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e676"/>
      <stop offset="100%" stop-color="#00695c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd600"/>
      <stop offset="100%" stop-color="#ff8f00"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Gear/pulse diagnostic circles -->
  <!-- Outer ring -->
  <circle cx="256" cy="230" r="145" fill="none" stroke="url(#green)" stroke-width="2" opacity="0.4"/>
  <!-- Middle ring -->
  <circle cx="256" cy="230" r="105" fill="none" stroke="url(#green)" stroke-width="2" opacity="0.6"/>
  <!-- Inner ring -->
  <circle cx="256" cy="230" r="65" fill="none" stroke="url(#green)" stroke-width="2.5" opacity="0.8"/>
  <!-- Pulse / EKG waveform -->
  <polyline points="100,230 160,230 185,170 210,290 235,195 256,230 290,230 320,230 345,170 365,290 390,230 420,230" 
    fill="none" stroke="url(#green)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <!-- Center dot -->
  <circle cx="256" cy="230" r="18" fill="url(#green)" opacity="0.9"/>
  <!-- Glow on center -->
  <ellipse cx="256" cy="230" rx="70" ry="70" fill="#00695c" opacity="0.2" filter="url(#blur)"/>
  <!-- Bottom bar -->
  <rect x="80" y="405" width="352" height="5" rx="3" fill="url(#gold)" opacity="0.8"/>
</svg>
