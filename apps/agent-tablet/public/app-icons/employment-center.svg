<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a2a6c"/>
      <stop offset="100%" stop-color="#06091a"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f9a825"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4fc3f7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0288d1" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="gf"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Glow halo -->
  <ellipse cx="256" cy="230" rx="130" ry="130" fill="#1565c0" opacity="0.25" filter="url(#blur)"/>
  <!-- Badge frame ring -->
  <circle cx="256" cy="210" r="130" fill="none" stroke="url(#glow)" stroke-width="3" opacity="0.6"/>
  <!-- Person silhouette head -->
  <circle cx="256" cy="165" r="52" fill="url(#glow)" opacity="0.9"/>
  <!-- Person body -->
  <path d="M148 320 Q148 255 256 255 Q364 255 364 320 L364 345 Q364 365 344 365 L168 365 Q148 365 148 345Z" fill="url(#glow)" opacity="0.85"/>
  <!-- ID badge / lanyard -->
  <rect x="230" y="295" width="52" height="38" rx="6" fill="#fff" opacity="0.15" stroke="#f9a825" stroke-width="2"/>
  <line x1="256" y1="255" x2="256" y2="295" stroke="#f9a825" stroke-width="3" opacity="0.7"/>
  <!-- Gold accent star -->
  <circle cx="256" cy="165" r="10" fill="url(#accent)" opacity="0.9"/>
  <!-- Bottom label bar -->
  <rect x="80" y="400" width="352" height="6" rx="3" fill="url(#accent)" opacity="0.7"/>
</svg>
