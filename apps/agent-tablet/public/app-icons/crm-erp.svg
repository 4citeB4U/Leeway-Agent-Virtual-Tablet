<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a0d4b"/>
      <stop offset="100%" stop-color="#06091a"/>
    </radialGradient>
    <linearGradient id="indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c4dff"/>
      <stop offset="100%" stop-color="#3d1a8f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd600"/>
      <stop offset="100%" stop-color="#ff8f00"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- People group icon (CRM) -->
  <circle cx="185" cy="185" r="45" fill="url(#indigo)" opacity="0.9"/>
  <path d="M120 275 Q120 240 185 240 Q250 240 250 275 L250 295 Q250 310 235 310 L135 310 Q120 310 120 295Z" fill="url(#indigo)" opacity="0.85"/>
  <!-- Bars chart (ERP) -->
  <rect x="285" y="310" width="30" height="60" rx="4" fill="url(#gold)" opacity="0.9"/>
  <rect x="325" y="270" width="30" height="100" rx="4" fill="url(#gold)" opacity="0.75"/>
  <rect x="365" y="230" width="30" height="140" rx="4" fill="url(#gold)" opacity="0.9"/>
  <!-- Chart baseline -->
  <line x1="275" y1="370" x2="410" y2="370" stroke="url(#gold)" stroke-width="3" opacity="0.6"/>
  <!-- Connecting line CRM → ERP -->
  <line x1="250" y1="255" x2="285" y2="270" stroke="url(#indigo)" stroke-width="2" stroke-dasharray="6 4" opacity="0.6"/>
  <!-- Glow -->
  <ellipse cx="256" cy="270" rx="140" ry="120" fill="#3d1a8f" opacity="0.12" filter="url(#blur)"/>
  <!-- Bottom bar -->
  <rect x="80" y="405" width="352" height="5" rx="3" fill="url(#gold)" opacity="0.8"/>
</svg>
