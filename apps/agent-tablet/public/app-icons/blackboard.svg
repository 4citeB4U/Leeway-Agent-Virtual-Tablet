<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a0d4b"/>
      <stop offset="100%" stop-color="#06091a"/>
    </radialGradient>
    <linearGradient id="purp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ce93d8"/>
      <stop offset="100%" stop-color="#7b1fa2"/>
    </linearGradient>
    <linearGradient id="chalk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0e0e0"/>
      <stop offset="100%" stop-color="#9e9e9e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd600"/>
      <stop offset="100%" stop-color="#ff8f00"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Board surface -->
  <rect x="80" y="130" width="352" height="230" rx="10" fill="#0a0d1a" stroke="url(#purp)" stroke-width="2.5"/>
  <!-- Chalk writing effect -->
  <path d="M110 200 L200 200" stroke="url(#chalk)" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <path d="M110 230 L260 230" stroke="url(#chalk)" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <path d="M110 260 L180 260" stroke="url(#chalk)" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  <!-- Math/formula style -->
  <path d="M230 185 Q250 165 270 185 Q290 205 310 185" fill="none" stroke="url(#chalk)" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <!-- Checkmarks -->
  <path d="M310 225 L325 240 L355 210" fill="none" stroke="url(#purp)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <path d="M310 258 L325 273 L355 243" fill="none" stroke="url(#purp)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <!-- Board glow -->
  <ellipse cx="256" cy="245" rx="150" ry="100" fill="#4a0080" opacity="0.1" filter="url(#blur)"/>
  <!-- Tray -->
  <rect x="80" y="358" width="352" height="14" rx="4" fill="#0d1120" stroke="url(#purp)" stroke-width="1.5" opacity="0.7"/>
  <!-- Gold accent bar -->
  <rect x="80" y="400" width="352" height="5" rx="3" fill="url(#gold)" opacity="0.8"/>
</svg>
